name: Integrar Regularizacion dentro de Operaciones
on:
  push:
    branches: [fix/operaciones-regularizacion-nav]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/operaciones-regularizacion-nav
      - name: Integrar vista en el portal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('operaciones/index.html')
          s=p.read_text()
          s=s.replace("  if(k==='regularizacion'){ cerrarMenu(); location.href='/operaciones/regularizacion'; return; }\n","")
          anchor="    else if(V==='cobranza')   await vCobranza();"
          if "V==='regularizacion'" not in s:
              if anchor not in s: raise SystemExit('No se encontró render de cobranza')
              s=s.replace(anchor,anchor+"\n    else if(V==='regularizacion') await vRegularizacion();",1)
          script='<script src="/operaciones/regularizacion-inline.js"></script>\n'
          if 'regularizacion-inline.js' not in s:
              if '</body>' not in s: raise SystemExit('No se encontró body')
              s=s.replace('</body>',script+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "echo-automation"
          git config user.email "actions@users.noreply.github.com"
          git add operaciones/index.html
          git commit -m "Mostrar Regularización dentro del Panel de Operaciones"
          git push
