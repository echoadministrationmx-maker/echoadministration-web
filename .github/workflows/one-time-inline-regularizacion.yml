name: Corregir Regularizacion dentro de Operaciones
on:
  push:
    branches: [fix/operaciones-regularizacion-nav]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/operaciones-regularizacion-nav
      - name: Corregir integración
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('operaciones/index.html')
          s=p.read_text()
          s=s.replace('</div></div><script src="/operaciones/regularizacion-inline.js"></script>\n</body></html>`);','</div></div></body></html>`);')
          s=s.replace("  if(k==='regularizacion'){ cerrarMenu(); location.href='/operaciones/regularizacion'; return; }\n","")
          anchor="    else if(V==='cobranza')   await vCobranza();"
          if "V==='regularizacion'" not in s:
              s=s.replace(anchor,anchor+"\n    else if(V==='regularizacion') await vRegularizacion();",1)
          script='<script src="/operaciones/regularizacion-inline.js"></script>\n'
          if script not in s:
              i=s.rfind('</body>')
              if i<0: raise SystemExit('No se encontró cierre body real')
              s=s[:i]+script+s[i:]
          p.write_text(s)
          Path('.github/workflows/one-time-inline-regularizacion.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name "echo-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Integrar Regularización correctamente dentro de Operaciones"
          git push
