name: Integrar Regularizacion en Operaciones
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Integrar acceso visible
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('operaciones/index.html')
          s=p.read_text()
          old="  {k:'cobranza',t:'Cobranza mensual',i:'📈'},"
          new=old+"\n  {k:'regularizacion',t:'Regularización y WhatsApp',i:'💬'},"
          if "{k:'regularizacion'" not in s:
              if old not in s: raise SystemExit('No se encontró punto de navegación')
              s=s.replace(old,new,1)
          old_ir="function ir(k){\n  V=k; cerrarMenu();"
          new_ir="function ir(k){\n  if(k==='regularizacion'){ cerrarMenu(); location.href='/operaciones/regularizacion'; return; }\n  V=k; cerrarMenu();"
          if "location.href='/operaciones/regularizacion'" not in s:
              if old_ir not in s: raise SystemExit('No se encontró función ir')
              s=s.replace(old_ir,new_ir,1)
          p.write_text(s)
          Path('.github/workflows/one-time-regularizacion-nav.yml').unlink()
          PY
      - name: Commit del cambio
        run: |
          git config user.name "echo-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Integrar Regularización y WhatsApp en panel de Operaciones"
          git push