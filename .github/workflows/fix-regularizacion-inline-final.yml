name: Corregir navegacion Regularizacion inline final
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'echo-automation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Quitar redireccion externa
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('operaciones/index.html')
          s=p.read_text()
          old="  if(k==='regularizacion'){ cerrarMenu(); location.href='/operaciones/regularizacion'; return; }\n"
          if old not in s:
              raise SystemExit('No se encontro la redireccion esperada')
          s=s.replace(old,'',1)
          p.write_text(s)
          Path('.github/workflows/fix-regularizacion-inline-final.yml').unlink()
          PY
      - name: Commit correccion
        run: |
          git config user.name "echo-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Mantener Regularización dentro del Panel de Operaciones"
          git push