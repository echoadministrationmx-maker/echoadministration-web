<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0C1320">
<meta name="robots" content="noindex">
<title>Registro de propietarios · Manzanas 60 y 61 · Echo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#0C1320;--navy:#14233C;--blue:#1847CC;--line:#D7E0EF;--muted:#4D5A70}
*{box-sizing:border-box}
body{margin:0;background:#EDF2F9;color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:23px 24px}
.brand{display:flex;align-items:center;gap:10px;margin:auto;max-width:620px;font-weight:700}
.logo{display:grid;place-items:center;height:32px;width:32px;background:#3765E7;border-radius:8px;font:800 19px 'Bricolage Grotesque',sans-serif}
main{max-width:668px;margin:42px auto;padding:0 24px 48px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 14px 40px #13264112;padding:32px}
h1{margin:2px 0 8px;font:800 clamp(28px,5vw,38px)/1.12 'Bricolage Grotesque',system-ui,sans-serif}
p{margin:0;color:var(--muted)}
.manzana{color:var(--blue);font-weight:800;margin-bottom:8px}
form:not([hidden]){display:grid;gap:15px;margin-top:24px}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;font-size:.91rem;font-weight:700;margin-bottom:4px}
label span{color:var(--muted);font-weight:500}
input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;color:var(--ink)}
button{background:var(--blue);color:#fff;padding:12px 20px;border:0;border-radius:10px;font:700 1rem 'DM Sans',sans-serif;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
:focus-visible{outline:3px solid #829EFF;outline-offset:2px}
small{color:var(--muted)}
a{color:var(--blue)}
.volver{display:inline-block;margin-bottom:12px;font-size:.9rem;font-weight:700}
#estado{color:#A71C37;font-size:.9rem}
#estado:empty{display:none}
@media(max-width:550px){main{margin-top:25px;padding-inline:14px}.card{padding:23px}}
</style>
</head>
<body>
<header><div class="brand"><span class="logo" aria-hidden="true">E</span> Echo Administración</div></header>
<main>
  <a class="volver" href="/portal">← Cambiar de manzana</a>
  <section class="card" aria-labelledby="titulo">
    <p class="manzana">Manzanas 60 y 61</p>
    <h1 id="titulo">Registro de propietarios</h1>
    <p id="registroIntro">Si eres propietario, envía tu nombre y unidad para que Echo Administración revise tu registro.</p>
    <form id="registro" method="post">
      <div><label for="nombre">Nombre completo</label><input name="nombre" id="nombre" autocomplete="name" minlength="2" maxlength="150" required></div>
      <div class="campos">
        <div><label for="edificio">Manzana y edificio</label><input name="edificio" id="edificio" maxlength="30" placeholder="Ej. 60-A o 61-A1" required></div>
        <div><label for="unidad">Número de unidad</label><input name="unidad" id="unidad" maxlength="30" required></div>
      </div>
      <div><label for="correo">Correo electrónico <span>(opcional)</span></label><input name="email" id="correo" type="email" autocomplete="email" maxlength="254"></div>
      <div><label for="telefono">Teléfono <span>(opcional)</span></label><input name="telefono" id="telefono" type="tel" autocomplete="tel" maxlength="30"></div>
      <small>Echo usará estos datos para actualizar el padrón de Manzanas 60 y 61. Consulta el <a href="/privacidad" target="_blank" rel="noopener">aviso de privacidad</a>.</small>
      <p id="estado" role="alert"></p>
      <button>Enviar registro</button>
    </form>
    <p id="enviado" role="status" tabindex="-1" hidden></p>
  </section>
</main>
<script src="/registro-propietarios/registro.js" defer></script>
</body>
</html>
