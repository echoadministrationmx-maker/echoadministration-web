<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0C1320">
<title>Reemitir comprobantes · Echo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#1847CC;--ink:#0C1320;--accent:#7BA8FF;--silver:#F2F4F8;--mid:#E0E6F5;--ok:#1B7A3D;--okbg:#E7F5EC;--warn:#B00020;--warnbg:#FBE9EC;--muted:#6A7382}
*{box-sizing:border-box}body{margin:0;background:var(--silver);color:var(--ink);font-family:'DM Sans',sans-serif}.wrap{max-width:980px;margin:0 auto;padding:22px}.top{display:flex;gap:14px;align-items:center;margin-bottom:18px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--accent));display:grid;place-items:center;color:#fff;font-weight:800}.top h1{font-family:'Bricolage Grotesque';font-size:1.35rem;margin:0}.sub{font-size:.86rem;color:var(--muted);margin:2px 0 0}.card,.item{background:#fff;border:1px solid var(--mid);border-radius:16px;padding:18px;margin-bottom:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:10px 14px;font-family:inherit;font-weight:700;cursor:pointer}.btn.gh{background:#fff;color:var(--ink);border:1px solid var(--mid)}.btn:disabled{opacity:.45;cursor:not-allowed}input{width:100%;border:1px solid var(--mid);border-radius:10px;padding:11px 12px;font:inherit}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.name{font-weight:700;flex:1}.tag{background:var(--ink);color:#fff;border-radius:8px;padding:4px 9px;font-weight:800}.pill{font-size:.75rem;font-weight:800;border-radius:999px;padding:4px 10px}.ok{background:var(--okbg);color:var(--ok)}.bad{background:var(--warnbg);color:var(--warn)}.amount{font-family:'Bricolage Grotesque';font-size:1.15rem;font-weight:800;margin-top:7px}.concepts{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.concept{background:var(--silver);border-radius:999px;padding:4px 9px;font-size:.76rem}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{text-align:center;color:var(--muted);padding:26px}.hide{display:none}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:12px 16px;font-weight:700;display:none}.toast.on{display:block}.toast.err{background:var(--warn)}@media(max-width:700px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.acts .btn{flex:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">E</div><div><h1>Reemitir comprobantes</h1><p class="sub">Recupera, descarga o vuelve a enviar comprobantes ya emitidos sin duplicar el pago ni generar un folio nuevo.</p></div></div>
  <div id="login" class="card">
    <div class="grid"><div><label>Usuario</label><input id="u" autocomplete="username"></div><div><label>Contraseña</label><input id="p" type="password" autocomplete="current-password"></div></div>
    <div class="acts"><button class="btn" id="entrar">Entrar</button><a class="btn gh" href="/operaciones/" style="text-decoration:none">Volver a Operaciones</a></div><div id="err" class="sub"></div>
  </div>
  <div id="app" class="hide">
    <div class="card"><div class="grid"><div><label>Buscar</label><input id="q" placeholder="Folio, unidad o residente"></div><div><label>Correo para reenvío</label><input id="mail" type="email" placeholder="residente@correo.com"></div></div><p class="sub">Los comprobantes cancelados se muestran para consulta, pero no se pueden reenviar como vigentes.</p></div>
    <div id="list"></div>
  </div>
</div><div id="toast" class="toast"></div>
<script>
const SB='https://nwqigjkmlkwyyblgqppm.supabase.co';
const KEY='sb_publishable_Gscgjva4RQkFZfwANPpueg_rKfWJ_nU';
let C={p_user:'',p_password:''}, REC=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const fecha=s=>s?new Date(s).toLocaleDateString('es-MX',{year:'numeric',month:'long',day:'numeric'}):'—';
function toast(t,err=false){const x=$('toast');x.textContent=t;x.className='toast on'+(err?' err':'');setTimeout(()=>x.className='toast',2600)}
async function rpc(fn,args){const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify(args)});if(!r.ok)throw new Error(await r.text());return r.json()}
$('entrar').onclick=async()=>{C={p_user:$('u').value.trim(),p_password:$('p').value};$('entrar').disabled=true;$('err').textContent='';try{const d=await rpc('pg_recibos',{...C,p_limite:250});REC=d.recibos||[];$('login').classList.add('hide');$('app').classList.remove('hide');render();}catch(e){$('err').textContent='No se pudo iniciar sesión o cargar los comprobantes.'}finally{$('entrar').disabled=false}};
$('q').oninput=render;
function render(){const q=($('q').value||'').toLowerCase().trim();const arr=REC.filter(r=>!q||[r.folio,r.ident,r.nombre].some(v=>String(v||'').toLowerCase().includes(q)));$('list').innerHTML=arr.length?arr.map((r,i)=>`<div class="item"><div class="row"><span class="tag">#${r.folio}</span><span class="name">${esc(r.ident)} · ${esc(r.nombre)}</span><span class="pill ${r.estado==='cancelado'?'bad':'ok'}">${r.estado==='cancelado'?'Cancelado':'Activo'}</span></div><p class="sub">Emitido ${fecha(r.created_at)} · ${esc(r.forma_pago||'')} · por ${esc(r.creado_por||'')}</p><div class="amount">${money(r.total)}</div><div class="concepts">${(r.conceptos||[]).map(c=>`<span class="concept">${esc(c.c)} · ${money(c.m)}</span>`).join('')}</div>${r.estado==='cancelado'?`<p class="sub" style="color:var(--warn)">Cancelado ${fecha(r.cancelado_at)} · ${esc(r.motivo_cancelacion||'')}</p>`:''}<div class="acts"><button class="btn gh" onclick="reemitir(${i})">↻ Reemitir / Descargar</button><button class="btn" onclick="reenviar(${i})" ${r.estado==='cancelado'?'disabled':''}>✉ Reenviar por correo</button></div></div>`).join(''):'<div class="card empty">No encontré comprobantes con ese filtro.</div>'}
function abrirRecibo(r){const conceptos=r.conceptos||[];const fil=conceptos.map(x=>`<tr><td>${esc(x.c)}</td><td class="r">${money(x.m)}</td></tr>`).join('');const w=window.open('','_blank');if(!w){toast('Permite ventanas emergentes.',true);return}w.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Comprobante #${r.folio}</title><style>body{font-family:Arial,sans-serif;background:#f3f4f6;padding:22px;color:#0c1320}.pb,.doc{max-width:720px;margin:auto}.pb{text-align:right;margin-bottom:10px}.pb button{background:#1847cc;color:#fff;border:0;border-radius:9px;padding:10px 16px;font-weight:700}.doc{background:#fff;border:1px solid #dbeafe;border-radius:12px;overflow:hidden}.hd{background:#1e40af;color:#fff;padding:28px;display:flex;justify-content:space-between;gap:20px}.hd h1{margin:0}.b{padding:28px}.badge{display:inline-block;background:#eef3ff;color:#1847cc;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;margin-top:8px}table{width:100%;border-collapse:collapse;margin-top:22px}td{padding:12px 0;border-bottom:1px solid #eee}.r{text-align:right;font-weight:600}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding-top:16px}.meta{margin-top:20px;background:#eff6ff;padding:14px;border-radius:9px;font-size:13px}.foot{text-align:center;color:#777;font-size:11px;margin-top:22px;padding-top:14px;border-top:1px solid #eee}@media print{body{background:#fff;padding:0}.pb{display:none}.doc{border:0}}</style></head><body><div class="pb"><button onclick="window.print()">🖨 Imprimir / Guardar PDF</button></div><div class="doc"><div class="hd"><div><small>ECHO ADMINISTRATION</small><h1>MANZANA 80</h1><div>ALDEA TULUM</div></div><div style="text-align:right"><small>FOLIO ORIGINAL</small><div style="font-size:22px;font-weight:700">#${r.folio}</div><span class="badge">COPIA REEMITIDA</span></div></div><div class="b"><div><b>${esc(r.nombre)}</b><br><span>${esc(r.ident)}</span></div><div style="margin-top:8px">Fecha original de emisión: ${fecha(r.created_at)}</div><table><tr><th style="text-align:left">Concepto</th><th style="text-align:right">Importe</th></tr>${fil}</table><div class="total"><span>Total</span><span>${money(r.total)}</span></div><div class="meta"><b>Forma de pago:</b> ${esc(r.forma_pago||'—')}<br><b>Reemisión:</b> copia del comprobante original. No representa un nuevo pago ni genera un folio adicional.</div><div class="foot">Echo Administración · Comprobante original #${r.folio}</div></div></div></body></html>`);w.document.close()}
function reemitir(i){const q=($('q').value||'').toLowerCase().trim();const arr=REC.filter(r=>!q||[r.folio,r.ident,r.nombre].some(v=>String(v||'').toLowerCase().includes(q)));abrirRecibo(arr[i])}
async function reenviar(i){const q=($('q').value||'').toLowerCase().trim();const arr=REC.filter(r=>!q||[r.folio,r.ident,r.nombre].some(v=>String(v||'').toLowerCase().includes(q)));const r=arr[i];const email=$('mail').value.trim()||r.email_enviado_a;if(!email){toast('Escribe un correo para reenviar.',true);return}try{const x=await fetch(`${SB}/functions/v1/enviar-recibo`,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify({p_user:C.p_user,p_password:C.p_password,folio:r.folio,email_destino:email})});const d=await x.json();toast(d&&d.ok?`Comprobante #${r.folio} reenviado`:'No se pudo reenviar.',!(d&&d.ok))}catch(e){toast('Error al reenviar el comprobante.',true)}}
</script>
</body></html>
