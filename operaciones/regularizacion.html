<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C1320">
<title>Regularización · Echo Operaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#1847CC;--ink:#0C1320;--accent:#7BA8FF;--silver:#F2F4F8;--mid:#E0E6F5;--ok:#1B7A3D;--okbg:#E7F5EC;--warn:#B00020;--warnbg:#FBE9EC;--amber:#B87503;--amberbg:#FBF1DF;--muted:#6A7382;--white:#fff;--sh:0 1px 2px rgba(12,19,32,.05),0 6px 20px rgba(12,19,32,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--silver);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif}.wrap{max-width:1120px;margin:auto;padding:18px}.top{background:var(--ink);color:#fff;padding:16px 18px;position:sticky;top:0;z-index:20}.topin{max-width:1120px;margin:auto;display:flex;gap:12px;align-items:center}.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--accent));display:grid;place-items:center;font:800 18px 'Bricolage Grotesque'}.top h1{font:700 18px 'Bricolage Grotesque';margin:0;flex:1}.top a{color:#fff;text-decoration:none;font-size:13px}.card,.item{background:#fff;border:1px solid var(--mid);border-radius:16px;box-shadow:var(--sh);padding:17px;margin-bottom:13px}.hero{background:linear-gradient(135deg,#EEF3FF,#fff);border-color:#B8CCFF}.grid{display:grid;gap:11px}.g4{grid-template-columns:repeat(4,1fr)}.kpi{padding:13px;border-radius:13px;background:#fff;border:1px solid var(--mid)}.kpi b{font:800 24px 'Bricolage Grotesque';display:block}.kpi span{font-size:12px;color:var(--muted)}input,select{width:100%;padding:11px 12px;border:1px solid var(--mid);border-radius:10px;font:inherit;background:#fff}.toolbar{display:grid;grid-template-columns:1fr 180px;gap:10px}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:#fff;font:700 13px 'DM Sans';cursor:pointer}.btn.gh{background:#fff;color:var(--ink);border:1px solid var(--mid)}.btn.wa{background:#128C7E}.btn.ok{background:var(--ok)}.pill{display:inline-flex;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800}.p20{background:var(--warnbg);color:var(--warn)}.p10{background:var(--amberbg);color:var(--amber)}.p0{background:#EEF3FF;color:var(--blue)}.pok{background:var(--okbg);color:var(--ok)}.head{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.head h3{font:700 16px 'Bricolage Grotesque';margin:0;flex:1}.sub{font-size:13px;color:var(--muted);margin:5px 0}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.fact{background:var(--silver);padding:10px;border-radius:10px}.fact span{display:block;font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:700}.fact b{font-size:14px}.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.empty{text-align:center;color:var(--muted);padding:35px}.sheet{position:fixed;inset:0;background:#0c1320aa;display:none;align-items:center;justify-content:center;padding:14px;z-index:40}.sheet.on{display:flex}.box{width:100%;max-width:760px;max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.plan{border:1px solid var(--mid);border-radius:14px;padding:14px}.plan.rec{border:2px solid var(--blue);background:#F7F9FF}.plan h4{margin:0 0 5px;font:700 15px 'Bricolage Grotesque'}.price{font:800 22px 'Bricolage Grotesque';color:var(--blue)}.note{background:#EEF3FF;padding:11px;border-radius:11px;font-size:13px}.hide{display:none!important}.login{max-width:390px;margin:9vh auto;padding:16px}.login .card{text-align:center;padding:28px}.login label{text-align:left;display:block;font-size:12px;font-weight:700;margin:10px 0 5px}.err{color:var(--warn);font-size:13px;font-weight:600;margin-top:10px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:11px;display:none;z-index:60}.toast.on{display:block}
@media(max-width:760px){.g4,.facts,.plans{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.wrap{padding:12px}.plan:last-child{grid-column:1/-1}}@media(max-width:430px){.g4,.facts,.plans{grid-template-columns:1fr}.plan:last-child{grid-column:auto}.acts .btn{flex:1}}
</style>
</head>
<body>
<div id="login" class="login"><div class="card"><div class="logo" style="margin:0 auto 12px">E</div><h2 style="font-family:'Bricolage Grotesque';margin:0">Regularización Echo</h2><p class="sub">Usa las mismas credenciales del Panel de Operaciones.</p><label>Usuario</label><input id="u" autocomplete="username"><label>Contraseña</label><input id="p" type="password" autocomplete="current-password"><button class="btn" id="entrar" style="width:100%;margin-top:16px">Entrar</button><div id="err" class="err"></div></div></div>
<div id="app" class="hide">
<header class="top"><div class="topin"><div class="logo">E</div><h1>Ofertas de regularización</h1><a href="/operaciones/">← Panel de Rosaura</a></div></header>
<main class="wrap"><section class="card hero"><div class="head"><div><h3>Campaña Manzana 80</h3><p class="sub">Paga el presente + arregla el pasado · cuota corriente $515</p></div></div><div class="grid g4" id="kpis"></div></section><section class="card"><div class="toolbar"><input id="q" placeholder="Buscar unidad, residente o teléfono"><select id="f"><option value="deuda">Con adeudo</option><option value="20">20% beneficio</option><option value="10">10% beneficio</option><option value="corto">Plan corto</option><option value="activo">Convenio activo</option></select></div></section><div id="list"></div></main>
</div>
<div class="sheet" id="sheet"><div class="box" id="box"></div></div><div class="toast" id="toast"></div>
<script src="/cobranza/planes.js"></script>
<script>
const SB='https://nwqigjkmlkwyyblgqppm.supabase.co';
const KEY='sb_publishable_Gscgjva4RQkFZfwANPpueg_rKfWJ_nU';
const CUOTA=515;
let C={p_user:'',p_password:''}, residentes=[], convenios=[];
const $=x=>document.getElementById(x); const money=n=>'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=t=>String(t??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
async function rpc(fn,args){const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify(args||{})});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),2200)}
function tel(r){return String(r.telefono||'').replace(/\D/g,'')}
function waTel(r){let n=tel(r);if(n.length===10)n='52'+n;return n}
function meses(r){return Array.isArray(r.meses_debe)?r.meses_debe.length:0}
function hist(r){return Math.max(0,Number(r.adeudo)||0)}
function activo(r){return convenios.find(c=>c.estado==='activo'&&(Number(c.id_residente)===Number(r.id_residente)||String(c.ident||'')===String(r.ident||'')))}
function calc(r){return window.ECHO_PLANES.calcular(hist(r),meses(r),CUOTA)}
function badge(p){return p===20?'p20':p===10?'p10':'p0'}
function planRec(r){const m=meses(r);return m>=13?12:m>=7?6:3}
function render(){
 const q=$('q').value.trim().toLowerCase(), f=$('f').value;
 let rows=residentes.filter(r=>hist(r)>0||activo(r));
 if(q)rows=rows.filter(r=>[r.ident,r.nombre_completo,r.telefono].some(v=>String(v||'').toLowerCase().includes(q)));
 rows=rows.filter(r=>{const a=activo(r),m=meses(r),d=window.ECHO_PLANES.obtenerDescuento(m);if(f==='activo')return !!a;if(a)return false;if(f==='20')return d===20;if(f==='10')return d===10;if(f==='corto')return m>=3&&m<=6;return hist(r)>0});
 rows.sort((a,b)=>meses(b)-meses(a)||hist(b)-hist(a));
 $('list').innerHTML=rows.length?rows.slice(0,100).map(card).join(''):'<div class="card empty">Sin residentes para este filtro.</div>';
 document.querySelectorAll('[data-offer]').forEach(b=>b.onclick=()=>openOffer(residentes.find(r=>Number(r.id_residente)===Number(b.dataset.offer))));
 document.querySelectorAll('[data-active]').forEach(b=>b.onclick=()=>openActive(residentes.find(r=>Number(r.id_residente)===Number(b.dataset.active))));
}
function card(r){const a=activo(r),m=meses(r),d=window.ECHO_PLANES.obtenerDescuento(m),p=calc(r).find(x=>x.meses===planRec(r))||calc(r)[1];return `<div class="item"><div class="head"><h3>${esc(r.ident)} · ${esc(r.nombre_completo)}</h3>${a?'<span class="pill pok">Convenio activo</span>':`<span class="pill ${badge(d)}">${d?d+'% beneficio':'Sin descuento'}</span>`}</div><p class="sub">${esc(r.telefono||'Sin teléfono')} · ${m} meses vencidos</p><div class="facts"><div class="fact"><span>Histórico</span><b>${money(hist(r))}</b></div><div class="fact"><span>Regularizado</span><b>${a?'—':money(p.adeudoConDescuento)}</b></div><div class="fact"><span>Plan sugerido</span><b>${a?'Vigente':p.nombre+' '+p.meses}</b></div><div class="fact"><span>Desde / mes</span><b>${a?money(a.abono_mensual):money(p.totalMensual)}</b></div></div><div class="acts">${a?`<button class="btn gh" data-active="${r.id_residente}">Ver convenio activo</button>`:`<button class="btn" data-offer="${r.id_residente}">🤝 Ofrecer regularización</button>`}</div></div>`}
function openActive(r){const a=activo(r);if(!a)return;show(`<div class="head"><h3>${esc(r.ident)} · Convenio activo</h3><span class="pill pok">Activo</span></div><p class="sub">${esc(r.nombre_completo)}</p><div class="facts"><div class="fact"><span>Monto acordado</span><b>${money(a.monto_total)}</b></div><div class="fact"><span>Abono mensual</span><b>${money(a.abono_mensual)}</b></div><div class="fact"><span>Saldo convenio</span><b>${money(a.saldo_convenio)}</b></div><div class="fact"><span>Próximo pago</span><b>${esc(a.proximo_pago||'—')}</b></div></div><div class="note" style="margin-top:13px">No ofrecer un segundo convenio mientras éste siga activo.</div><div class="acts"><button class="btn gh" onclick="closeSheet()">Cerrar</button></div>`)}
function openOffer(r){const ps=calc(r),d=ps[0].descuentoPct;show(`<div class="head"><h3>${esc(r.ident)} · Oferta de regularización</h3><span class="pill ${badge(d)}">${d?d+'% beneficio':'Sin descuento'}</span></div><p class="sub">${esc(r.nombre_completo)} · ${meses(r)} meses vencidos</p><div class="facts"><div class="fact"><span>Adeudo histórico</span><b>${money(hist(r))}</b></div><div class="fact"><span>Descuento</span><b>${money(ps[0].descuentoMonto)}</b></div><div class="fact"><span>Saldo regularizado</span><b>${money(ps[0].adeudoConDescuento)}</b></div><div class="fact"><span>Cuota corriente</span><b>${money(CUOTA)}</b></div></div><div class="plans">${ps.map(p=>`<div class="plan ${p.recomendado?'rec':''}"><h4>${p.nombre}${p.recomendado?' ⭐':''}</h4><div class="price">${money(p.totalMensual)}</div><div class="sub">al mes · incluye $515 corriente</div><div class="sub"><b>${money(p.totalQuincenal)}</b> quincenal</div><button class="btn ${p.recomendado?'':'gh'}" style="width:100%;margin-top:9px" onclick="sendOffer(${r.id_residente},${p.meses})">Enviar por WhatsApp</button></div>`).join('')}</div><div class="note"><b>Echo Social:</b> si ninguna alternativa es sostenible, Rosaura puede escalar el caso para revisión personalizada. No se aprueba automáticamente.</div><div class="acts"><button class="btn gh" onclick="copyOffer(${r.id_residente})">Copiar opciones</button><button class="btn gh" onclick="closeSheet()">Cerrar</button></div>`)}
function message(r,p){const d=p.descuentoPct;return `Hola ${String(r.nombre_completo||'').split(' ')[0]}, somos Echo Administración de Manzana 80. Queremos apoyarte a regularizar tu cuenta de la unidad ${r.ident}.\n\nTu adeudo histórico elegible es de ${money(hist(r))}.${d?` Por su antigüedad, cuentas con un beneficio de regularización del ${d}%, por lo que el saldo elegible queda en ${money(p.adeudoConDescuento)}.`:''}\n\nLa opción ${p.nombre} es de ${money(p.totalMensual)} al mes, incluyendo tu cuota corriente de $515. También puede manejarse como ${money(p.totalQuincenal)} por quincena.\n\nSi te interesa esta opción, responde a este mensaje y con gusto la revisamos contigo. Si ya realizaste un pago o no reconoces el saldo, avísanos para revisarlo.\n\nEcho Administración`;}
async function sendOffer(id,term){const r=residentes.find(x=>Number(x.id_residente)===Number(id));if(!r)return;const p=calc(r).find(x=>x.meses===Number(term));const n=waTel(r);if(!n){toast('Este residente no tiene teléfono');return}window.open(`https://wa.me/${n}?text=${encodeURIComponent(message(r,p))}`,'_blank','noopener');try{await rpc('pg_crear_llamada',{...C,p_id_residente:r.id_residente,p_motivo:'Oferta de regularización por WhatsApp',p_descripcion:`Oferta ${p.nombre} ${p.meses} meses. Histórico ${money(hist(r))}. Beneficio ${p.descuentoPct}%. Saldo regularizado ${money(p.adeudoConDescuento)}. Total mensual ${money(p.totalMensual)}.`,p_evidencia:null,p_seguimiento:null,p_origen:'whatsapp'});toast('WhatsApp abierto · oferta registrada')}catch(e){toast('WhatsApp abierto · no se pudo registrar seguimiento')}}
function copyOffer(id){const r=residentes.find(x=>Number(x.id_residente)===Number(id));const lines=calc(r).map(p=>`${p.nombre}: ${money(p.totalMensual)}/mes · ${money(p.totalQuincenal)}/quincena`).join('\n');navigator.clipboard.writeText(`Unidad ${r.ident}\nAdeudo histórico: ${money(hist(r))}\nBeneficio: ${calc(r)[0].descuentoPct}%\nSaldo regularizado: ${money(calc(r)[0].adeudoConDescuento)}\n${lines}`).then(()=>toast('Opciones copiadas'))}
function show(h){$('box').innerHTML=h;$('sheet').classList.add('on')}function closeSheet(){$('sheet').classList.remove('on')}
$('sheet').onclick=e=>{if(e.target===$('sheet'))closeSheet()};
$('entrar').onclick=async()=>{const u=$('u').value.trim(),p=$('p').value;if(!u||!p){$('err').textContent='Escribe usuario y contraseña.';return}$('entrar').disabled=true;$('err').textContent='';try{C={p_user:u,p_password:p};const [d,c]=await Promise.all([rpc('pg_directorio',C),rpc('pg_convenios_pago',C)]);residentes=d.residentes||[];convenios=c.convenios||[];$('login').classList.add('hide');$('app').classList.remove('hide');const conDeuda=residentes.filter(r=>hist(r)>0).length,c20=residentes.filter(r=>!activo(r)&&window.ECHO_PLANES.obtenerDescuento(meses(r))===20).length,c10=residentes.filter(r=>!activo(r)&&window.ECHO_PLANES.obtenerDescuento(meses(r))===10).length,act=convenios.filter(c=>c.estado==='activo').length;$('kpis').innerHTML=`<div class="kpi"><b>${conDeuda}</b><span>con adeudo</span></div><div class="kpi"><b>${c20}</b><span>beneficio 20%</span></div><div class="kpi"><b>${c10}</b><span>beneficio 10%</span></div><div class="kpi"><b>${act}</b><span>convenios activos</span></div>`;render()}catch(e){$('err').textContent='No se pudo iniciar sesión. Revisa tus credenciales.';$('entrar').disabled=false}};
$('q').oninput=()=>render();$('f').onchange=()=>render();
</script>
</body></html>
