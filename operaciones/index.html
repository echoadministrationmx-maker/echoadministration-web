<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0C1320">
<title>Panel de Operaciones · Echo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1847CC;--ink:#0C1320;--accent:#7BA8FF;--silver:#F2F4F8;--mid:#E0E6F5;
  --ok:#1B7A3D;--okbg:#E7F5EC;--warn:#B00020;--warnbg:#FBE9EC;--amber:#B87503;--amberbg:#FBF1DF;
  --muted:#6A7382;--faint:#94A0B0;
  --sh:0 1px 2px rgba(12,19,32,.05),0 6px 20px rgba(12,19,32,.06);
  --nav:264px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--silver);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,.num{font-family:'Bricolage Grotesque','DM Sans',sans-serif;letter-spacing:-.015em}
h2{font-size:1.18rem;margin:0}
h3{font-size:1rem;margin:0}
a{color:var(--blue)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.shell{display:flex;min-height:100vh}
.side{width:var(--nav);background:var(--ink);color:#fff;flex:none;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:60;transition:transform .25s}
.side .brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--accent));display:grid;place-items:center;font-weight:800;font-family:'Bricolage Grotesque';flex:none}
.brand .n{font-weight:700;font-size:1rem;line-height:1.15}
.brand .n small{display:block;font-weight:400;font-size:.72rem;opacity:.55}
.side nav{flex:1;overflow-y:auto;padding:6px 10px 14px}
.side .grp{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:#ffffff59;font-weight:700;padding:14px 10px 6px}
.nv{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:#ffffffbf;font-family:inherit;font-size:.9rem;font-weight:600;padding:11px 12px;border-radius:11px;cursor:pointer;text-align:left}
.nv:hover{background:#ffffff12;color:#fff}
.nv.on{background:var(--blue);color:#fff}
.nv .ic{font-size:1.05rem;width:21px;text-align:center;flex:none}
.nv .cnt{margin-left:auto;background:var(--warn);color:#fff;border-radius:999px;padding:1px 7px;font-size:.68rem;font-weight:800}
.nv.on .cnt{background:#fff;color:var(--blue)}
.side .foot{padding:12px 16px 18px;border-top:1px solid #ffffff1a;font-size:.78rem;color:#ffffff8c;display:flex;align-items:center;gap:9px}
.side .foot button{margin-left:auto;background:none;border:0;color:#fff;text-decoration:underline;font-family:inherit;font-size:.78rem;cursor:pointer}

.main{flex:1;margin-left:var(--nav);min-width:0}
.top{position:sticky;top:0;z-index:40;background:#fffffff2;backdrop-filter:blur(9px);border-bottom:1px solid var(--mid);display:flex;align-items:center;gap:10px;padding:12px 18px}
.burger{display:none;border:1px solid var(--mid);background:#fff;border-radius:10px;width:40px;height:40px;font-size:1.15rem;cursor:pointer;flex:none}
.top h1{font-size:1.06rem;font-weight:700;margin:0;font-family:'Bricolage Grotesque';flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{border:1px solid var(--mid);background:#fff;border-radius:10px;height:40px;min-width:40px;padding:0 11px;font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;position:relative;flex:none}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;background:var(--warn);color:#fff;border-radius:999px;font-size:.62rem;font-weight:800;padding:1px 5px}
.body{padding:18px;max-width:1080px}
.scrim{position:fixed;inset:0;background:#0c1320a6;z-index:55;display:none}
.scrim.on{display:block}

/* ---------- COMPONENTES ---------- */
.card{background:#fff;border:1px solid var(--mid);border-radius:16px;box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.card.tight{padding:14px}
.chead{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:13px}
.chead h2,.chead h3{flex:1;min-width:150px}
.sub{color:var(--muted);font-size:.84rem;margin:3px 0 0}
label{display:block;font-size:.79rem;font-weight:700;color:#485061;margin-bottom:5px}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--mid);border-radius:11px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:82px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.grid{display:grid;gap:11px}
.g2{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.btn{appearance:none;border:0;border-radius:11px;padding:12px 18px;font-size:.92rem;font-weight:700;font-family:inherit;cursor:pointer;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ok{background:var(--ok)} .btn.dan{background:var(--warn)}
.btn.gh{background:#fff;color:var(--ink);border:1px solid var(--mid)}
.btn.sm{padding:9px 13px;font-size:.8rem;border-radius:9px}
.btn.wide{width:100%}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:800;padding:4px 11px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)} .p-warn{background:var(--warnbg);color:var(--warn)}
.p-amb{background:var(--amberbg);color:var(--amber)} .p-blue{background:#EEF3FF;color:var(--blue)}
.p-gray{background:var(--silver);color:var(--muted)}
.tag{font-family:'Bricolage Grotesque';font-weight:800;background:var(--ink);color:#fff;border-radius:9px;padding:5px 10px;font-size:.82rem;flex:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--mid);border-radius:14px;padding:14px 15px}
.kpi .l{font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-family:'Bricolage Grotesque';font-weight:800;font-size:1.5rem;margin-top:2px;line-height:1.1}
.kpi .s{font-size:.74rem;color:var(--faint);margin-top:1px}
.item{background:#fff;border:1px solid var(--mid);border-radius:14px;padding:15px;margin-bottom:10px}
.item .ihead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item .iname{font-weight:700;font-size:.96rem;flex:1;min-width:130px}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:4px 16px;margin-top:10px;font-size:.85rem}
.dl div{display:flex;gap:7px}
.dl b{color:var(--faint);font-weight:600;flex:none;min-width:64px}
.acts{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.empty{text-align:center;padding:34px 18px;background:var(--silver);border-radius:14px;color:var(--muted)}
.empty .e{font-size:2.2rem}
.empty .t{font-weight:700;color:var(--ink);margin-top:6px}
.bar{height:9px;background:#EFF2F7;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:1px solid var(--mid);background:#fff;border-radius:999px;padding:8px 15px;font-family:inherit;font-weight:600;font-size:.83rem;cursor:pointer;color:#485061;white-space:nowrap;flex:none}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:13px 19px;border-radius:12px;font-weight:600;font-size:.88rem;opacity:0;transition:.24s;z-index:90;max-width:92%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--warn)} .toast.good{background:var(--ok)}
.sp{display:inline-block;width:15px;height:15px;border:2px solid #ffffff70;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sheet{position:fixed;inset:0;background:#0c1320a6;z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
.sheet.on{display:flex}
.sheet .box{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:520px;max-height:88vh;overflow:auto}
details.acc{border:1px solid var(--mid);border-radius:13px;padding:13px 15px;margin-bottom:13px;background:#fff}
details.acc summary{cursor:pointer;font-weight:700;color:var(--blue);font-size:.9rem;list-style:none}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::before{content:'＋ ';font-weight:800}
details.acc[open] summary::before{content:'− '}
.mono{font-variant-numeric:tabular-nums}

/* ---------- LOGIN ---------- */
#login{max-width:390px;margin:8vh auto;padding:0 16px}

/* ---------- MÓVIL ---------- */
@media(max-width:900px){
  .side{transform:translateX(-100%);box-shadow:0 0 40px #0006;width:280px}
  .side.on{transform:none}
  .main{margin-left:0}
  .burger{display:block}
  .body{padding:14px 13px 26px}
  .card{padding:15px;border-radius:15px}
  .top{padding:10px 13px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:9px}
  .kpi .v{font-size:1.3rem}
  .g2,.g3{grid-template-columns:1fr}
  .acts .btn{flex:1;min-width:calc(50% - 4px)}
  .dl{grid-template-columns:1fr;gap:3px}
}
@media(max-width:380px){ .kpis{grid-template-columns:1fr} }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="card" style="text-align:center;padding:28px">
    <div class="logo" style="width:46px;height:46px;font-size:1.3rem;margin:0 auto 14px">E</div>
    <h2>Panel de Operaciones</h2>
    <p class="sub" style="margin-bottom:20px">Echo Administración · Manzana 80</p>
    <div style="text-align:left"><label>Usuario</label><input id="u" autocomplete="username"></div>
    <div style="text-align:left;margin-top:12px"><label>Contraseña</label><input id="p" type="password" autocomplete="current-password"></div>
    <button class="btn wide" id="entrar" style="margin-top:18px">Entrar</button>
    <div id="lerr" style="color:var(--warn);font-weight:600;font-size:.84rem;margin-top:11px"></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<div class="shell hide" id="shell">
  <aside class="side" id="side">
    <div class="brand"><div class="logo">E</div><div class="n">Operaciones<small id="cond">Manzana 80</small></div></div>
    <nav id="nav"></nav>
    <div class="foot"><span id="quien"></span><button id="salir">Salir</button></div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="burger" id="burger">☰</button>
      <h1 id="titulo">Resumen</h1>
      <button class="iconbtn" id="btnNotif" title="Notificaciones">🔔<span class="dot hide" id="notifDot"></span></button>
      <button class="iconbtn" id="btnRef" title="Actualizar">↻</button>
    </header>
    <div class="body" id="vista"></div>
  </div>
</div>

<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>
<div class="toast" id="toast"></div>

<script>
const SB="https://nwqigjkmlkwyyblgqppm.supabase.co";
const KEY="sb_publishable_Gscgjva4RQkFZfwANPpueg_rKfWJ_nU";
const MES=['','enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
let C={p_user:'',p_password:''}, V='inicio', CORTE={anio:2026,mes:8};
let D={cob:null,units:null,dir:null,inc:null,ll:null,av:null,ga:null,sv:null,cv:null,dc:null,rt:null,nt:null,an:null,hi:null,rc:null,cn:null};
const $=id=>document.getElementById(id);
const money=n=>'$'+Number(n||0).toLocaleString('es-MX');
const fecha=s=>s?new Date(String(s).length<=10?s+'T12:00:00':s).toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'}):'—';
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function rpc(fn,args){
  const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',
    headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},
    body:JSON.stringify(args||{})});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
function toast(m,t){const e=$('toast');e.textContent=m;e.className='toast on'+(t?' '+t:'');setTimeout(()=>e.className='toast',2700);}
function sheet(html){$('sheetBox').innerHTML=html;$('sheet').classList.add('on');}
function cerrarSheet(){$('sheet').classList.remove('on');}
$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')cerrarSheet();});

/* ============ NAVEGACIÓN ============ */
const MENU=[
  {g:'Cobranza'},
  {k:'inicio',t:'Resumen',i:'📊'},
  {k:'cobranza',t:'Cobranza mensual',i:'📈'},
  {k:'analisis',t:'Análisis de cobranza',i:'🔎'},
  {k:'historico',t:'Histórico por edificio',i:'🗓️'},
  {k:'recibos',t:'Recibos emitidos',i:'🧾'},
  {k:'constancias',t:'Estados sin adeudo',i:'📄'},
  {k:'pagos',t:'Registrar pago',i:'💳'},
  {g:'Comunidad'},
  {k:'residentes',t:'Residentes',i:'👥'},
  {k:'llamadas',t:'Llamadas de atención',i:'⚠️'},
  {k:'incidencias',t:'Incidencias',i:'🔧'},
  {k:'avisos',t:'Avisos del portal',i:'📢'},
  {g:'Finanzas'},
  {k:'gastos',t:'Gastos e IVA',i:'🧾'},
  {k:'servicios',t:'Luz y agua',i:'⚡'},
  {g:'Servicios'},
  {k:'rentas',t:'Rentas',i:'🏖️'},
  {k:'convenios',t:'Convenios de pago',i:'🤝'},
  {k:'descuentos',t:'Descuentos',i:'🏷️'}
];
function pintarNav(){
  $('nav').innerHTML=MENU.map(m=>m.g
    ? `<div class="grp">${m.g}</div>`
    : `<button class="nv${V===m.k?' on':''}" data-k="${m.k}"><span class="ic">${m.i}</span>${m.t}<span class="cnt hide" id="cnt-${m.k}"></span></button>`).join('');
  $('nav').querySelectorAll('.nv').forEach(b=>b.onclick=()=>ir(b.dataset.k));
  pintarBadges();
}
function pintarBadges(){
  const set=(k,n)=>{const e=$('cnt-'+k); if(!e)return; if(n>0){e.textContent=n;e.classList.remove('hide');}else e.classList.add('hide');};
  set('llamadas', D.ll&&D.ll.resumen ? Number(D.ll.resumen.pendiente_revision||0) : 0);
  set('incidencias', D.inc ? (D.inc.incidencias||[]).filter(i=>String(i.estado||'').toLowerCase()==='pendiente').length : 0);
  const n=D.nt?Number(D.nt.pendientes||0):0;
  const d=$('notifDot'); if(n>0){d.textContent=n;d.classList.remove('hide');}else d.classList.add('hide');
}
function ir(k){
  V=k; cerrarMenu();
  const m=MENU.find(x=>x.k===k)||{t:'Panel'};
  $('titulo').textContent=m.t;
  $('nav').querySelectorAll('.nv').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  $('vista').scrollTop=0; window.scrollTo(0,0);
  render();
}
function abrirMenu(){$('side').classList.add('on');$('scrim').classList.add('on');}
function cerrarMenu(){$('side').classList.remove('on');$('scrim').classList.remove('on');}
$('burger').onclick=abrirMenu; $('scrim').onclick=cerrarMenu;

/* ============ LOGIN ============ */
async function entrar(){
  const u=$('u').value.trim(), p=$('p').value, b=$('entrar');
  if(!u||!p){$('lerr').textContent='Escribe usuario y contraseña.';return;}
  b.disabled=true;b.innerHTML='<span class="sp"></span>';$('lerr').textContent='';
  try{
    const d=await rpc('pg_cobranza',{p_user:u,p_password:p});
    if(!d||d.ok===false){$('lerr').textContent='Usuario o contraseña incorrectos.';b.disabled=false;b.textContent='Entrar';return;}
    C={p_user:u,p_password:p}; D.cob=d.meses||[];
    $('login').classList.add('hide'); $('shell').classList.remove('hide');
    $('quien').textContent=u;
    const cfg=await rpc('pg_config',C); if(cfg&&cfg.ok)CORTE={anio:cfg.anio,mes:cfg.mes};
    cargarNotifs();
    pintarNav(); ir('inicio');
  }catch(e){$('lerr').textContent='Sin conexión. Revisa tu internet.';}
  b.disabled=false;b.textContent='Entrar';
}
$('entrar').onclick=entrar;
$('p').addEventListener('keydown',e=>{if(e.key==='Enter')entrar();});
$('salir').onclick=()=>location.reload();

/* ============ RENDER ============ */
function loading(){ $('vista').innerHTML='<div class="empty"><div class="e">⏳</div><div class="t">Cargando…</div></div>'; }
async function render(){
  loading();
  try{
    if(V==='inicio')      await vInicio();
    else if(V==='cobranza')   await vCobranza();
    else if(V==='analisis')   await vAnalisis();
    else if(V==='historico')  await vHistorico();
    else if(V==='recibos')    await vRecibos();
    else if(V==='constancias')await vConstancias();
    else if(V==='pagos')      await vPagos();
    else if(V==='residentes') await vResidentes();
    else if(V==='llamadas')   await vLlamadas();
    else if(V==='incidencias')await vIncidencias();
    else if(V==='avisos')     await vAvisos();
    else if(V==='gastos')     await vGastos();
    else if(V==='servicios')  await vServicios();
    else if(V==='rentas')     await vRentas();
    else if(V==='convenios')  await vConvenios();
    else if(V==='descuentos') await vDescuentos();
    pintarBadges();
  }catch(e){
    $('vista').innerHTML=`<div class="empty"><div class="e">⚠️</div>
      <div class="t">No se pudo cargar esta sección</div>
      <div style="margin-top:6px">Revisa tu conexión y usa ↻ Actualizar.</div>
      <div style="margin-top:12px;background:#fff;border:1px solid var(--mid);border-radius:10px;padding:11px;font-size:.78rem;color:var(--warn);text-align:left;word-break:break-word">
        <b>Detalle técnico:</b> ${esc(e&&e.message?e.message:e)}
      </div>
      <button class="btn gh" style="margin-top:12px" onclick="render()">Reintentar</button>
    </div>`;
  }
}

/* ---------- INICIO ---------- */
async function vInicio(){
  if(!D.an){D.an=await rpc('pg_analisis',{...C,p_anio:CORTE.anio,p_mes:CORTE.mes});}
  if(!D.ll){D.ll=await rpc('pg_llamadas',{...C,p_flujo:null});}
  if(!D.inc){D.inc=await rpc('pg_incidencias',C);}
  const g=D.an.global||{}, ed=(D.an.edificios||[]), cj=D.an.caja||{};
  const llp=D.ll&&D.ll.resumen?Number(D.ll.resumen.pendiente_revision||0):0;
  const incp=(D.inc.incidencias||[]).filter(i=>String(i.estado||'').toLowerCase()==='pendiente').length;
  const peor=ed.slice().sort((a,b)=>Number(b.adeudo_historico)-Number(a.adeudo_historico)).slice(0,3);
  $('vista').innerHTML=`
    <div class="card" style="background:linear-gradient(135deg,#1847CC,#3D6BE0);color:#fff;border:0">
      <div style="font-size:.76rem;opacity:.85;font-weight:700;text-transform:uppercase;letter-spacing:.05em">Dinero recibido · ${MES[CORTE.mes]} ${CORTE.anio}</div>
      <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:6px">
        <div class="num" style="font-size:2.4rem;font-weight:800">${money(cj.total)}</div>
        <div style="opacity:.9;font-size:.9rem">${cj.movimientos||0} pagos · ${cj.unidades||0} unidades</div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:13px">
        <div style="background:#ffffff26;border-radius:11px;padding:10px 13px;flex:1;min-width:135px">
          <div style="font-size:.7rem;opacity:.8;font-weight:700;text-transform:uppercase">Cuotas del mes</div>
          <div class="num" style="font-size:1.25rem;font-weight:800">${money(cj.del_mes)}</div></div>
        <div style="background:#ffffff26;border-radius:11px;padding:10px 13px;flex:1;min-width:135px">
          <div style="font-size:.7rem;opacity:.8;font-weight:700;text-transform:uppercase">Cartera recuperada</div>
          <div class="num" style="font-size:1.25rem;font-weight:800">${money(cj.recuperado)}</div>
          <div style="font-size:.68rem;opacity:.75">${cj.mov_recuperado||0} pagos de meses viejos</div></div>
      </div>
      <div style="margin-top:14px;border-top:1px solid #ffffff2e;padding-top:11px">

/* ---------- COBRANZA ---------- */
let cobAnio=2026;
async function vCobranza(){
  if(!D.cob){const d=await rpc('pg_cobranza',C); D.cob=d.meses||[];}
  const anios=[...new Set(D.cob.map(m=>m.anio))].sort();
  const rows=D.cob.filter(m=>m.anio===cobAnio);
  const bill=rows.filter(m=>m.facturables>0);
  const ti=bill.reduce((a,m)=>a+Number(m.ideal_monto),0), tc=bill.reduce((a,m)=>a+Number(m.cobrado),0);
  const pct=ti?100*tc/ti:0;
  let opts=''; for(let y=2026;y<=2027;y++)for(let m=1;m<=12;m++)
    opts+=`<option value="${y}-${m}"${y===CORTE.anio&&m===CORTE.mes?' selected':''}>${MES[m]} ${y}</option>`;
  $('vista').innerHTML=`
    <div class="card" style="background:#EEF3FF;border-color:var(--accent)">
      <div class="chead" style="margin:0">
        <div style="flex:1;min-width:190px">
          <h3>Mes en curso de operación</h3>
          <p class="sub">Define hasta qué mes se cobra. Afecta adeudos, residentes, avisos y gastos.</p>
        </div>
        <select id="corte" style="max-width:190px">${opts}</select>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="l">Ideal ${cobAnio}</div><div class="v">${money(ti)}</div></div>
      <div class="kpi"><div class="l">Cobrado</div><div class="v" style="color:var(--ok)">${money(tc)}</div></div>
      <div class="kpi"><div class="l">Recaudación</div><div class="v" style="color:var(--blue)">${pct.toFixed(1)}%</div></div>
    </div>
    <div class="card">
      <div class="chead"><h3>Mes por mes</h3><div class="seg">${anios.map(y=>`<button class="${y===cobAnio?'on':''}" data-y="${y}">${y}</button>`).join('')}</div></div>
      ${rows.map(m=>{
        const p=Number(m.pct_ideal||0), f=m.facturables>0;
        const col=p>=70?'var(--ok)':p>=45?'var(--amber)':'var(--warn)';
        return `<div style="padding:11px 0;border-bottom:1px solid var(--silver);${f?'':'opacity:.45'}">
          <div style="display:flex;justify-content:space-between;gap:10px;font-size:.87rem;margin-bottom:6px;flex-wrap:wrap">
            <b style="text-transform:capitalize">${MES[m.mes]}<span style="color:var(--faint);font-weight:400"> · cuota ${money(m.cuota)}</span></b>
            <span class="mono">${f?p.toFixed(1)+'%':'—'} · ${money(m.cobrado)} <span style="color:var(--faint)">de ${money(m.ideal_monto)}</span></span>
          </div>
          <div class="bar"><i style="width:${Math.min(p,100)}%;background:${col}"></i></div>
        </div>`;}).join('')}
    </div>`;
  $('vista').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{cobAnio=Number(b.dataset.y);vCobranza();});
  $('corte').onchange=async e=>{
    const [y,m]=e.target.value.split('-').map(Number);
    const r=await rpc('pg_set_mes_corte',{...C,p_anio:y,p_mes:m});
    if(r&&r.ok){CORTE={anio:y,mes:m};D={...D,cob:null,units:null,dir:null,ga:null,an:null};toast('Mes actualizado: '+MES[m]+' '+y,'good');vCobranza();}
  };
}

/* ---------- HISTÓRICO POR EDIFICIO ---------- */
let hiAnio=2026, hiVista='pct';
async function vHistorico(){
  if(!D.hi||D.hi.anio!==hiAnio){D.hi=await rpc('pg_historico_edificios',{...C,p_anio:hiAnio});}
  const eds=D.hi.edificios||[], tot=D.hi.totales||[];
  const col=p=>p>=70?'var(--ok)':p>=45?'var(--amber)':p>0?'var(--warn)':'#C9D2E0';
  const EST={sin_cargos:['#F4F6FA','#94A0B0','Sin facturar'],futuro:['#F4F6FA','#C3CAD6','Aún no facturado'],
             por_vencer:['#EEF3FF','#1847CC','Por vencer'],normal:['','','']};
  const cel=(m)=>{
    if(m.estado_mes==='sin_cargos'||m.estado_mes==='futuro')
      return {txt:'—',bg:'#F4F6FA',fg:'#B7C0CE',t:'Sin cargos generados para este mes'};
    const p=Number(m.pct)||0;
    const txt = hiVista==='pct' ? p.toFixed(0)+'%' : hiVista==='recibido' ? money(m.recibido) : money(m.pendiente);
    if(m.estado_mes==='por_vencer')
      return {txt:txt,bg:'#E4EBFF',fg:'#1847CC',t:'Facturado pero aún no vence'};
    return {txt:txt,bg:col(p),fg:p>0?'#fff':'#8794A6',t:''};
  };
  $('vista').innerHTML=`
    <div class="card">
      <div class="chead">
        <div style="flex:1;min-width:180px"><h3>Cobranza mes a mes por edificio</h3>
          <p class="sub">Cada celda es un mes. Toca para ver el detalle.</p></div>
        <select id="hiA" style="max-width:120px">${[2023,2024,2025,2026].map(y=>`<option${y===hiAnio?' selected':''}>${y}</option>`).join('')}</select>
      </div>
      <div class="seg">
        ${[['pct','% cobranza'],['recibido','Dinero recibido'],['pendiente','Pendiente']].map(([k,t])=>`<button class="${hiVista===k?'on':''}" data-v="${k}">${t}</button>`).join('')}
      </div>
    </div>

    <div class="card" style="overflow-x:auto">
      <table style="border-collapse:separate;border-spacing:3px;width:100%;min-width:640px">
        <thead><tr>
          <th style="text-align:left;font-size:.72rem;color:var(--faint);padding:4px 6px;position:sticky;left:0;background:#fff">EDIF</th>
          ${MES.slice(1).map(m=>`<th style="font-size:.68rem;color:var(--faint);text-transform:uppercase;padding:4px 2px">${m.slice(0,3)}</th>`).join('')}
        </tr></thead>
        <tbody>
        ${eds.map((e,i)=>`<tr>
          <td style="font-weight:800;font-size:.8rem;padding:4px 6px;position:sticky;left:0;background:#fff;white-space:nowrap">${e.edificio}<span style="color:var(--faint);font-weight:500"> ·${e.unidades}</span></td>
          ${(e.meses||[]).map(m=>{const c=cel(m);
            return `<td style="padding:0"><button class="hiCel" data-e="${i}" data-m="${m.mes}" title="${c.t}"
              style="width:100%;min-width:42px;border:0;border-radius:7px;padding:9px 2px;cursor:pointer;font-family:inherit;
              font-size:.68rem;font-weight:800;background:${c.bg};color:${c.fg}">${c.txt}</button></td>`;}).join('')}
        </tr>`).join('')}
        </tbody>
        <tfoot><tr>
          <td style="font-weight:800;font-size:.8rem;padding:8px 6px;position:sticky;left:0;background:#fff">TOTAL</td>
          ${tot.map(m=>{
            const sin = m.estado_mes==='sin_cargos'||m.estado_mes==='futuro';
            const p=Number(m.pct)||0;
            return `<td style="text-align:center;font-size:.72rem;font-weight:800;padding:8px 2px;color:${sin?'#B7C0CE':(p>=70?'var(--ok)':p>=45?'var(--amber)':'var(--warn)')}">${sin?'—':p.toFixed(0)+'%'}</td>`;}).join('')}
        </tr></tfoot>
      </table>
      <div class="sub" style="margin-top:12px;line-height:1.7">
        🟢 ≥70% &nbsp;·&nbsp; 🟠 45–69% &nbsp;·&nbsp; 🔴 &lt;45% &nbsp;·&nbsp;
        <span style="background:#E4EBFF;color:#1847CC;border-radius:5px;padding:2px 7px;font-weight:700">azul</span> facturado pero aún no vence &nbsp;·&nbsp;
        <b style="color:#B7C0CE">—</b> sin cargos generados (no cuenta como cobrado)
      </div>
    </div>`;
  $('hiA').onchange=e=>{hiAnio=Number(e.target.value);D.hi=null;vHistorico();};
  $('vista').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{hiVista=b.dataset.v;vHistorico();});
  $('vista').querySelectorAll('.hiCel').forEach(b=>b.onclick=()=>{
    const e=eds[Number(b.dataset.e)], m=(e.meses||[]).find(x=>x.mes==b.dataset.m);
    const sin = m.estado_mes==='sin_cargos'||m.estado_mes==='futuro';
    sheet(`<h3>Edificio ${e.edificio} · ${MES[m.mes]} ${hiAnio}</h3>
      <p class="sub">${e.unidades} unidades · ${m.cargos} cargos generados</p>
      ${sin?`<div style="background:var(--silver);border-radius:12px;padding:18px;margin-top:13px;text-align:center">
          <div style="font-size:1.8rem">📭</div>
          <div style="font-weight:700;margin-top:5px">Sin cargos en este mes</div>
          <div class="sub">No se ha generado la cuota de ${MES[m.mes]} para estas unidades, así que no hay cobranza que medir.</div>
        </div>`:`
      <div class="kpis" style="margin-top:13px">
        <div class="kpi"><div class="l">% cobranza</div><div class="v" style="color:${col(Number(m.pct)||0)}">${Number(m.pct||0).toFixed(1)}%</div></div>
        <div class="kpi"><div class="l">Cobrado</div><div class="v">${money(m.cobrado)}</div><div class="s">de ${money(m.facturado)} facturado</div></div>
        <div class="kpi"><div class="l">Pendiente</div><div class="v" style="color:var(--warn)">${money(m.pendiente)}</div></div>
        <div class="kpi"><div class="l">Recibido en el mes</div><div class="v" style="color:var(--ok)">${money(m.recibido)}</div><div class="s">${money(m.recuperado)} de cartera vieja</div></div>
      </div>
      ${m.estado_mes==='por_vencer'?'<p class="sub" style="margin-top:10px;color:var(--blue);font-weight:600">Este mes ya está facturado pero aún no vence.</p>':''}`}
      <div class="acts"><button class="btn gh wide" onclick="cerrarSheet()">Cerrar</button></div>`);
  });
}

let uSel=null, uFiltro={q:'',edif:'',orden:'ident'};
async function vPagos(){
  if(!D.units){const d=await rpc('pg_listar_unidades',C); D.units=d.unidades||[];}
  const edifs=[...new Set(D.units.map(u=>(u.num||'').trim()).filter(Boolean))].sort();
  let it=D.units.slice();
  if(uFiltro.edif)it=it.filter(u=>(u.num||'').trim()===uFiltro.edif);
  if(uFiltro.q){const q=uFiltro.q.toLowerCase();it=it.filter(u=>(u.ident||'').toLowerCase().includes(q)||(u.nombre_completo||'').toLowerCase().includes(q));}
  if(uFiltro.orden==='mayor')it.sort((a,b)=>b.adeudo-a.adeudo);
  else if(uFiltro.orden==='menor')it.sort((a,b)=>a.adeudo-b.adeudo);
  else it.sort((a,b)=>(a.ident||'').localeCompare(b.ident||'',undefined,{numeric:true}));
  const deuda=it.reduce((a,u)=>a+Number(u.adeudo||0),0);
  $('vista').innerHTML=`
    <div class="card">
      <div class="grid g3">
        <div><label>Buscar</label><input id="fq" value="${esc(uFiltro.q)}" placeholder="A-101 o nombre"></div>
        <div><label>Edificio</label><select id="fe"><option value="">Todos</option>${edifs.map(e=>`<option${uFiltro.edif===e?' selected':''}>${e}</option>`).join('')}</select></div>
        <div><label>Ordenar</label><select id="fo">
          <option value="ident"${uFiltro.orden==='ident'?' selected':''}>Unidad (A-Z)</option>
          <option value="mayor"${uFiltro.orden==='mayor'?' selected':''}>Mayor adeudo</option>
          <option value="menor"${uFiltro.orden==='menor'?' selected':''}>Menor adeudo</option></select></div>
      </div>
      <p class="sub" style="margin-top:11px">${it.length} unidades · adeudo mostrado ${money(deuda)} · vencido a ${MES[CORTE.mes]} ${CORTE.anio}</p>
    </div>
    <div id="ulist">${it.slice(0,60).map((u,i)=>`
      <div class="item" style="cursor:pointer" data-i="${i}">
        <div class="ihead"><span class="tag">${u.ident}</span><span class="iname">${esc(u.nombre_completo)}</span>
        <span class="pill ${Number(u.adeudo)>0?'p-warn':'p-ok'}">${Number(u.adeudo)>0?money(u.adeudo):'Al corriente ✓'}</span></div>
        ${Number(u.adeudo)>0?`<div class="sub" style="margin-top:6px">${u.meses_pend} ${u.meses_pend==1?'mes':'meses'} pendientes · toca para registrar pago</div>`:''}
      </div>`).join('')}
      ${it.length>60?'<p class="sub">Mostrando 60. Afina la búsqueda.</p>':''}
      ${it.length===0?'<div class="empty"><div class="e">🔍</div><div class="t">Sin coincidencias</div></div>':''}
    </div>`;
  $('fq').oninput=e=>{uFiltro.q=e.target.value;clearTimeout(window._t);window._t=setTimeout(vPagos,300);};
  $('fe').onchange=e=>{uFiltro.edif=e.target.value;vPagos();};
  $('fo').onchange=e=>{uFiltro.orden=e.target.value;vPagos();};
  $('ulist').querySelectorAll('.item[data-i]').forEach(el=>el.onclick=()=>abrirUnidad(it[Number(el.dataset.i)]));
}

async function marcarPagos(u,d){
  const box=$('sheetBox');
  const sel=[...box.querySelectorAll('input[type=checkbox]:checked')];

  const b=$('marcar'); b.disabled=true; b.innerHTML='<span class="sp"></span>';
  try{

          <option value="sinmail"${rFiltro.ver==='sinmail'?' selected':''}>Sin correo</option>
          <option value="sinchip"${rFiltro.ver==='sinchip'?' selected':''}>Sin chip</option></select></div>

          <option value="nombre"${rFiltro.orden==='nombre'?' selected':''}>Nombre</option></select></div>

      <p class="sub" style="margin-top:11px">${D.dir.length} residentes · ${cM} correo · ${cT} teléfono · ${cC} chip · mostrando ${it.length}</p>

function resumenAnios(meses){
  const m={};
  (meses||[]).forEach(c=>{const t=String(c).replace('Cuota ','').trim(); const y=t.slice(-4); const mm=t.slice(0,-4).trim().toLowerCase();
    const q=(y==='2026'&&['julio','agosto','septiembre','octubre','noviembre','diciembre'].includes(mm))?515:500;
    if(!m[y])m[y]={y,n:0,t:0}; m[y].n++; m[y].t+=q;});
  return Object.values(m).sort((a,b)=>a.y.localeCompare(b.y));
}

}

        <div><label>Unidad</label><input id="sI" list="sU" placeholder="A-101 (vacío = áreas comunes)"><datalist id="sU">${D.units.map(u=>`<option value="${u.ident}">`).join('')}</datalist></div>
        <div><label>Servicio</label><select id="sT">${Object.entries(ICO).map(([k,v])=>`<option value="${k}">${v} ${k}</option>`).join('')}</select></div>
        <div><label>Periodo *</label><input id="sP" value="${CORTE.anio}-${String(CORTE.mes).padStart(2,'0')}"></div>
        <div><label>Consumo</label><input id="sC" placeholder="245 kWh / 12 m³"></div>
        <div><label>Monto *</label><input id="sM" type="number" step="0.01"></div>
        <div><label>Vencimiento</label><input id="sV" type="date"></div>
      </div>
      <div style="margin-top:11px"><label>Liga al PDF</label><input id="sL" placeholder="https://…"></div>
      <button class="btn wide" id="sG" style="margin-top:13px">Cargar recibo</button>
    </details>
    <div class="card tight"><label>Periodo</label><select id="sF"><option value="">Todos</option>${(D.sv.periodos||[]).map(p=>`<option${svPer===p?' selected':''}>${p}</option>`).join('')}</select></div>
    ${recs.length?recs.map(x=>`
      <div class="item">
        <div class="ihead"><span class="iname">${ICO[x.tipo]||'📄'} ${esc(x.ident)} · ${esc(x.periodo)}</span>
          <span class="pill ${x.pagado?'p-ok':'p-warn'}">${x.pagado?'Pagado ✓':'Pendiente'}</span></div>
        <p class="sub">${esc(x.propietario||'—')}${x.consumo?' · '+esc(x.consumo):''}${x.fecha_vencimiento?' · vence '+fecha(x.fecha_vencimiento):''}</p>
        <div style="font-weight:700;margin-top:5px">${money(x.monto)}${x.archivo_url?` · <a href="${esc(x.archivo_url)}" target="_blank">Ver PDF</a>`:''}</div>
        <div class="acts"><button class="btn gh sm" data-sp="${x.id}" data-v="${x.pagado?0:1}">${x.pagado?'Marcar pendiente':'Marcar pagado'}</button>
          <button class="btn gh sm" data-sd="${x.id}" style="color:var(--warn)">Borrar</button></div>
      </div>`).join(''):'<div class="empty"><div class="e">⚡💧</div><div class="t">Sin recibos</div><div>Carga los de CFE y CAPA.</div></div>'}`;
  $('sF').onchange=e=>{svPer=e.target.value;vServicios();};
  $('sG').onclick=async()=>{
    if(!$('sP').value.trim()||!Number($('sM').value)){toast('Periodo y monto son obligatorios.','err');return;}
    const b=$('sG');b.disabled=true;b.innerHTML='<span class="sp"></span>';
    const r2=await rpc('pg_cargar_recibo_servicio',{...C,p_ident:$('sI').value.trim(),p_tipo:$('sT').value,
      p_periodo:$('sP').value.trim(),p_consumo:$('sC').value.trim(),p_monto:Number($('sM').value),
      p_venc:$('sV').value||null,p_url:$('sL').value.trim()});
    if(r2&&r2.ok){toast('Recibo cargado','good');vServicios();}else{toast('No se pudo cargar.','err');b.disabled=false;b.textContent='Cargar recibo';}
  };
  $('vista').querySelectorAll('[data-sp]').forEach(b=>b.onclick=async()=>{
    const r2=await rpc('pg_recibo_servicio_estado',{...C,p_id:Number(b.dataset.sp),p_pagado:b.dataset.v==='1'});
    if(r2&&r2.ok){toast('Actualizado','good');vServicios();}
  });
  $('vista').querySelectorAll('[data-sd]').forEach(b=>b.onclick=async()=>{
    if(!confirm('¿Borrar este recibo?'))return;
    const r2=await rpc('pg_borrar_recibo_servicio',{...C,p_id:Number(b.dataset.sd)});
    if(r2&&r2.ok){toast('Borrado','good');vServicios();}
  });
}

/* ---------- RENTAS ---------- */
async function vRentas(){
  D.rt=await rpc('pg_rentas',{...C,p_condominio:1});
  const rs=D.rt.rentas||[];
  $('vista').innerHTML=`
    <div class="card"><h3>Programa de rentas</h3>
      <p class="sub">Unidades inscritas al servicio de renta vacacional operado por Echo. Los propietarios solicitan desde su portal.</p></div>
    ${rs.length?rs.map(x=>`
      <div class="item">
        <div class="ihead"><span class="tag">${esc(x.ident)}</span><span class="iname">${esc(x.nombre_publicado||x.propietario)}</span>
          <span class="pill ${x.activa?'p-ok':'p-amb'}">${x.activa?'Activa':'Por aprobar'}</span></div>
        <p class="sub">${esc(x.propietario)}${x.telefono?' · '+esc(x.telefono):''}</p>
        <div class="dl">
          <div><b>Tarifa</b> ${x.tarifa_noche?money(x.tarifa_noche)+'/noche':'—'}</div>
          <div><b>Comisión</b> ${x.comision_echo||20}%</div>
          <div><b>Reservas</b> ${x.reservas_proximas||0} próximas</div>
          <div><b>Mes</b> ${money(x.ingreso_mes)} − ${money(x.gastos_mes)} gastos</div>
        </div>
        <div class="acts"><button class="btn ${x.activa?'gh':''} sm" data-ra="${x.unidad_id}" data-v="${x.activa?0:1}">${x.activa?'Desactivar':'Activar programa'}</button></div>
      </div>`).join(''):'<div class="empty"><div class="e">🏖️</div><div class="t">Sin unidades inscritas</div><div>Los propietarios se registran desde su portal.</div></div>'}`;
  $('vista').querySelectorAll('[data-ra]').forEach(b=>b.onclick=async()=>{
    const r=await rpc('pg_guardar_renta',{...C,p_unidad_id:Number(b.dataset.ra),p_activa:b.dataset.v==='1',
      p_nombre:null,p_recamaras:null,p_capacidad:null,p_tarifa:null,p_comision:null,p_ical_airbnb:null,p_ical_booking:null,p_notas:null});
    if(r&&r.ok){toast('Actualizado','good');vRentas();}
  });
}

/* ---------- CONVENIOS DE PAGO ---------- */
async function vConvenios(){
  if(!D.units){const d=await rpc('pg_listar_unidades',C); D.units=d.unidades||[];}
  D.cv=await rpc('pg_convenios_pago',C); D.dir=null; D.an=null;
  const cs=D.cv.convenios||[];
  const LBL={activo:['Activo','p-ok'],cumplido:['Cumplido','p-blue'],incumplido:['Incumplido','p-warn'],cancelado:['Cancelado','p-gray']};
  const deudores=D.units.filter(u=>Number(u.adeudo)>0);
  $('vista').innerHTML=`
    <details class="acc"><summary>Nuevo convenio de pago</summary>
      <div class="grid g2" style="margin-top:12px">
        <div><label>Unidad *</label><select id="cU">${deudores.map(u=>`<option value="${u.id_residente}">${u.ident} · debe ${money(u.adeudo)}</option>`).join('')}</select></div>
        <div><label>Monto total *</label><input id="cT" type="number"></div>
        <div><label>Abono mensual *</label><input id="cA" type="number"></div>
        <div><label>Día de pago</label><input id="cD" type="number" value="5" min="1" max="28"></div>
        <div><label>Inicio</label><input id="cI" type="date"></div>
        <div><label>Término</label><input id="cFin" type="date"></div>
        <div><label>Tipo</label><input id="cTi" placeholder="Pago en parcialidades"></div>
        <div><label>Notas internas</label><input id="cN"></div>
      </div>
      <div style="margin-top:11px"><label>Condiciones (las ve el residente)</label><textarea id="cC" placeholder="Ej. Abono el día 5 de cada mes. El incumplimiento de dos abonos cancela el convenio."></textarea></div>
      <button class="btn wide" id="cG" style="margin-top:13px">Guardar convenio</button>
    </details>
    ${cs.length?cs.map(c=>`
      <div class="item">
        <div class="ihead"><span class="tag">${esc(c.ident)}</span><span class="iname">${esc(c.nombre)}</span>
          <span class="pill ${LBL[c.estado][1]}">${LBL[c.estado][0]}</span></div>
        <p class="sub">Desde ${fecha(c.fecha_inicio)} · día ${c.dia_pago} · por ${esc(c.creado_por)}</p>
        <div class="dl"><div><b>Total</b> ${money(c.monto_total)}</div><div><b>Abono</b> ${money(c.abono_mensual)}/mes</div>
          <div><b>Pagado</b> ${money(c.pagado_bajo_convenio)}</div>
          <div><b>Saldo</b> <span style="font-weight:700">${money(c.saldo_convenio)}</span></div>
          <div><b>Próximo pago</b> ${fecha(c.proximo_pago)}</div>
          <div><b>Término</b> ${c.fecha_fin?fecha(c.fecha_fin):'sin fecha'}</div></div>
        ${c.condiciones?`<div style="background:var(--silver);border-radius:9px;padding:9px 11px;margin-top:8px;font-size:.83rem"><b>Condiciones:</b> ${esc(c.condiciones)}</div>`:''}
        ${c.notas?`<p class="sub">${esc(c.notas)}</p>`:''}
        <div class="acts">${['activo','cumplido','incumplido','cancelado'].filter(e=>e!==c.estado).map(e=>`<button class="btn gh sm" data-ce="${c.id}" data-v="${e}">${LBL[e][0]}</button>`).join('')}</div>
      </div>`).join(''):'<div class="empty"><div class="e">🤝</div><div class="t">Sin convenios</div><div>Documenta los acuerdos con deudores.</div></div>'}`;
  $('cG').onclick=async()=>{
    const t=Number($('cT').value), a=Number($('cA').value);
    if(!t||!a){toast('Monto total y abono son obligatorios.','err');return;}
    const r=await rpc('pg_crear_convenio_pago',{...C,p_id_residente:Number($('cU').value),p_monto_total:t,
      p_abono_mensual:a,p_dia_pago:Number($('cD').value)||5,p_fecha_inicio:$('cI').value||null,p_notas:$('cN').value.trim()||null,
      p_fecha_fin:$('cFin').value||null,p_condiciones:$('cC').value.trim()||null,p_tipo:$('cTi').value.trim()||null});
    if(r&&r.ok){toast('Convenio guardado','good');vConvenios();}else toast('No se pudo guardar.','err');
  };
  $('vista').querySelectorAll('[data-ce]').forEach(b=>b.onclick=async()=>{
    const r=await rpc('pg_actualizar_convenio_pago',{...C,p_id:Number(b.dataset.ce),p_estado:b.dataset.v});
    if(r&&r.ok){toast('Actualizado','good');vConvenios();}
  });
}

/* ---------- DESCUENTOS ---------- */
async function vDescuentos(){
  D.dc=await rpc('pg_comercios',C);
  const cs=D.dc.comercios||[];
  $('vista').innerHTML=`
    <details class="acc"><summary>Publicar descuento</summary>
      <div class="grid g3" style="margin-top:12px">
        <div><label>Emoji</label><input id="dI" placeholder="🍕" maxlength="4"></div>
        <div><label>Negocio *</label><input id="dN" placeholder="Pizzería Tulum"></div>
        <div><label>Descuento *</label><input id="dD" placeholder="2x1 los martes"></div>
      </div>
      <div class="grid g2" style="margin-top:11px">
        <div><label>Vence (opcional)</label><input id="dF" type="date"></div>
        <div><label>Texto de vigencia</label><input id="dV" placeholder="Permanente"></div>
      </div>
      <button class="btn wide" id="dG" style="margin-top:13px">Publicar</button>
    </details>
    ${cs.length?cs.map(c=>`
      <div class="item" style="${c.activo?'':'opacity:.55'}">
        <div class="ihead"><span style="font-size:1.6rem">${c.icono||'🤝'}</span><span class="iname">${esc(c.nombre_negocio)}</span>
          <span class="pill ${c.activo?'p-ok':'p-gray'}">${c.activo?'Visible':'Oculto'}</span></div>
        <div style="color:var(--blue);font-weight:600;margin-top:5px">${esc(c.descuento)}</div>
        <p class="sub">Vigencia: ${esc(c.vigencia||'—')}</p>
        <div class="acts"><button class="btn gh sm" data-dt="${c.id}" data-v="${c.activo?0:1}">${c.activo?'Ocultar':'Mostrar'}</button></div>
      </div>`).join(''):'<div class="empty"><div class="e">🏷️</div><div class="t">Sin descuentos</div></div>'}`;
  $('dG').onclick=async()=>{
    const n=$('dN').value.trim(), d=$('dD').value.trim();
    if(!n||!d){toast('Negocio y descuento son obligatorios.','err');return;}
    const r=await rpc('pg_crear_comercio',{...C,p_icono:$('dI').value.trim(),p_nombre:n,p_descuento:d,
      p_vigencia:$('dV').value.trim()||null,p_vigencia_fecha:$('dF').value||null});
    if(r&&r.ok){toast('Publicado','good');vDescuentos();}else toast('No se pudo publicar.','err');
  };
  $('vista').querySelectorAll('[data-dt]').forEach(b=>b.onclick=async()=>{
    const r=await rpc('pg_actualizar_comercio',{...C,p_id:Number(b.dataset.dt),p_icono:null,p_nombre:null,
      p_descuento:null,p_vigencia:null,p_vigencia_fecha:null,p_activo:b.dataset.v==='1'});
    if(r&&r.ok){toast('Actualizado','good');vDescuentos();}
  });
}

/* ---------- NOTIFICACIONES ---------- */
async function cargarNotifs(){
  try{ D.nt=await rpc('pg_notificaciones',C); pintarBadges(); }catch(e){}
}
$('btnNotif').onclick=async()=>{
  await cargarNotifs();
  const it=(D.nt&&D.nt.items)||[];
  sheet(`<h3>Notificaciones</h3><p class="sub">${D.nt?D.nt.pendientes:0} sin revisar</p>
    <div style="margin-top:12px">${it.length?it.map(n=>`
      <div class="item" style="${n.leida?'opacity:.6':''}">
        <div class="ihead"><span class="iname" style="font-size:.9rem">${esc(n.titulo)}</span>
          <span class="pill ${n.tipo==='contacto'?'p-blue':'p-amb'}">${n.tipo==='contacto'?'Contacto':'Llamada'}</span></div>
        <p class="sub">${esc(n.detalle)}</p>
        <p class="sub">${fecha(n.created_at)}</p>
        ${n.tipo==='contacto'&&n.id_residente?`<div class="acts"><button class="btn sm" data-vc="${n.id_residente}" data-n="${n.id}">✓ Verificar contacto</button></div>`:''}
      </div>`).join(''):'<div class="empty"><div class="e">🔔</div><div class="t">Sin notificaciones</div></div>'}</div>
    <div class="acts"><button class="btn gh wide" onclick="cerrarSheet()">Cerrar</button></div>`);
  $('sheetBox').querySelectorAll('[data-vc]').forEach(b=>b.onclick=async()=>{
    const r=await rpc('pg_verificar_contacto',{...C,p_id_residente:Number(b.dataset.vc),p_notif:Number(b.dataset.n)});
    if(r&&r.ok){toast('Contacto verificado','good');cerrarSheet();D.dir=null;cargarNotifs();}
  });
};

/* ---------- ACTUALIZAR ---------- */
$('btnRef').onclick=async()=>{
  const b=$('btnRef'); b.disabled=true; b.innerHTML='<span class="sp" style="border-color:#0003;border-top-color:var(--blue)"></span>';
  D={cob:null,units:null,dir:null,inc:null,ll:null,av:null,ga:null,sv:null,cv:null,dc:null,rt:null,nt:null,an:null,hi:null,rc:null,cn:null};
  await cargarNotifs(); await render();
  toast('Datos actualizados','good');
  b.disabled=false; b.textContent='↻';
};
